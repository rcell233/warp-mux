name: Warp Mux macOS

on:
  push:
    branches: [master, codex/ssh-mux-macos]
  workflow_dispatch:
    inputs:
      architecture:
        description: macOS architecture to build
        type: choice
        required: true
        default: both
        options: [both, aarch64, x86_64]

permissions:
  contents: read

concurrency:
  group: mux-macos-${{ github.ref }}-${{ inputs.architecture || (contains(github.event.head_commit.message, '[arm-only]') && 'aarch64') || (contains(github.event.head_commit.message, '[intel-only]') && 'x86_64') || 'both' }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: false
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - name: Test SSH config and session parsing
        run: cargo test --locked --manifest-path tools/mux-tests/Cargo.toml
      - name: Lint backend
        run: cargo clippy --locked --manifest-path tools/mux-tests/Cargo.toml --all-targets -- -D warnings

  build:
    needs: backend-tests
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (inputs.architecture == 'aarch64' || contains(github.event.head_commit.message, '[arm-only]'))
              && '[{"runner":"macos-15","arch":"aarch64"}]'
            || (inputs.architecture == 'x86_64' || contains(github.event.head_commit.message, '[intel-only]'))
              && '[{"runner":"macos-26-intel","arch":"x86_64"}]'
            || '[{"runner":"macos-15","arch":"aarch64"},{"runner":"macos-26-intel","arch":"x86_64"}]'
          ) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: mux-macos-${{ matrix.arch }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Install public build dependencies
        run: |
          brew install protobuf create-dmg
          ./script/macos/install_build_deps
          ./script/install_cargo_bundle
          ./script/install_cargo_release_deps --no-build-deps
      - name: Check complete GUI before packaging
        run: ./script/macos/bundle --channel oss --profile mux --arch '${{ matrix.arch }}' --check-only
      - name: Build OSS app and ad-hoc signed DMG
        id: bundle
        run: |
          ./script/macos/bundle --channel oss --profile mux --selfsign --arch '${{ matrix.arch }}' \
            --dmg-name-suffix "mux-${GITHUB_SHA:0:7}-${{ matrix.arch }}"
      - name: Verify packaged app and disk image
        env:
          DMG_PATH: ${{ steps.bundle.outputs.dmg_path }}
        run: |
          test -s "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 target/mux/bundle/osx/WarpOss.app
          lipo -archs target/mux/bundle/osx/WarpOss.app/Contents/MacOS/warp-oss
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"
          printf '## Download\n\nDownload **WarpMux-macOS-${{ matrix.arch }}** under Artifacts below and unzip it to obtain the DMG.\n\nCommit: `%s`\n\nThe app is `WarpOss.app`; this is an ad-hoc signed, unnotarized test build.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Launch packaged app and capture startup
        run: bash .github/scripts/mux-startup-smoke.sh target/mux/bundle/osx/WarpOss.app target/mux-startup
      - name: Upload startup evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WarpMux-startup-${{ matrix.arch }}
          path: target/mux-startup/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WarpMux-macOS-${{ matrix.arch }}
          path: |
            ${{ steps.bundle.outputs.dmg_path }}
            ${{ steps.bundle.outputs.dmg_path }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
