[package]
name = "warp-mux-backend-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
command = { path = "../../crates/command" }
tokio = { version = "1", features = ["rt", "time"] }
glob = "=0.3.1"
shlex = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
warp_util = { path = "../../crates/warp_util" }
